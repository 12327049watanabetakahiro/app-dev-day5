<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>滞留の地形 | 都市の記憶を採集する装置</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        :root {
            --bg: #ffffff;
            --text-main: #1a1a1a;
            --text-dim: #777777;
            --accent: #000000;
            --border: #eeeeee;
            --tag-bg: #f7f7f7;
            --tag-selected: #333333;
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            letter-spacing: 0.05em;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .step { display: none; padding: 30px 20px; flex-direction: column; }
        .step.active { display: flex; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            padding: 40px 20px 20px;
            text-align: left;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 400;
            line-height: 1.6;
        }

        .search-container {
            position: relative;
            margin-bottom: 15px;
            z-index: 1001;
        }

        .search-input-wrapper {
            display: flex;
            background: var(--tag-bg);
            border-radius: 8px;
            padding: 12px 15px;
            align-items: center;
        }

        #place-search {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 1rem;
            color: var(--text-main);
        }

        #search-results {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #fff;
            box-shadow: var(--shadow);
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .search-result-item {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            cursor: pointer;
        }

        .map-wrapper {
            width: 100%;
            height: 400px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        #map { height: 100%; width: 100%; }
        /* 地図をフルカラー（標準）に戻す */
        .leaflet-tile-pane { filter: none; }

        .tag-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .tag-btn, .timezone-btn, .emotion-btn {
            font-size: 0.85rem;
            padding: 16px 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-main);
            text-align: center;
            border-radius: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .tag-btn.selected, .timezone-btn.selected {
            background: var(--tag-selected);
            color: #fff;
            border-color: var(--tag-selected);
        }

        /* 感情別の色設定 */
        .emotion-btn[data-emo="落ち着きたい"].selected { background: #7DA7D9; color: #fff; border-color: #7DA7D9; }
        .emotion-btn[data-emo="考え事をしたい"].selected { background: #D9C77D; color: #fff; border-color: #D9C77D; }
        .emotion-btn[data-emo="逃げたい"].selected { background: #D9947D; color: #fff; border-color: #D9947D; }
        .emotion-btn[data-emo="一人になりたい"].selected { background: #A78AD9; color: #fff; border-color: #A78AD9; }

        .timezone-btn small { opacity: 0.6; display: block; margin-top: 4px; font-size: 0.65rem; }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            background: var(--tag-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            outline: none;
            margin-bottom: 30px;
        }

        .confirm-item {
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .confirm-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .confirm-value {
            font-size: 1rem;
            font-weight: 500;
        }

        .confirm-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .confirm-tag {
            font-size: 0.75rem;
            padding: 4px 10px;
            background: var(--tag-bg);
            border-radius: 4px;
        }

        .btn-container {
            margin-top: auto;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 20px 0;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
            text-align: center;
        }

        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: var(--bg); color: var(--text-dim); border: 1px solid var(--border); }
        .btn:disabled { background: #eee; color: #ccc; cursor: not-allowed; }

        .success-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .success-text {
            font-size: 1.2rem;
            font-weight: 200;
            letter-spacing: 0.4em;
            margin-bottom: 40px;
        }

        .btn-outline {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-decoration: underline;
            background: none;
            border: none;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.2rem; }
            .map-wrapper { height: 350px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- STEP 1: 位置選択 -->
        <section id="step-1" class="step active">
            <header>
                <h1>滞留の地形</h1>
                <p class="subtitle">あなたが自然と行ってしまう場所を<br>都市に記録してください</p>
            </header>

            <div class="search-container">
                <div class="search-input-wrapper">
                    <input type="text" id="place-search" placeholder="場所を検索（例: 京都駅）">
                </div>
                <div id="search-results"></div>
            </div>

            <div class="map-wrapper">
                <div id="map"></div>
            </div>

            <button class="btn btn-primary" id="to-step-2" disabled>場所を確定する</button>
        </section>

        <!-- STEP 2: タグ・コメント -->
        <section id="step-2" class="step">
            <header>
                <h1>滞留の気配</h1>
                <p class="subtitle">その場所でのあなたの状態を選んでください</p>
            </header>

            <div class="form-group">
                <label>感覚の断片（複数選択可）</label>
                <div class="tag-grid" id="tag-container">
                    <div class="tag-btn" data-tag="落ち着く">落ち着く</div>
                    <div class="tag-btn" data-tag="一人になれる">一人になれる</div>
                    <div class="tag-btn" data-tag="考え事をする">考え事をする</div>
                    <div class="tag-btn" data-tag="逃げ場所">逃げ場所</div>
                    <div class="tag-btn" data-tag="時間を潰す">時間を潰す</div>
                    <div class="tag-btn" data-tag="なぜか来る">なぜか来る</div>
                    <div class="tag-btn" data-tag="何もしなくていい">何もしなくていい</div>
                    <div class="tag-btn" data-tag="その他">その他</div>
                </div>
            </div>

            <div class="form-group">
                <label>滞留する時間（必須）</label>
                <div class="tag-grid" id="timezone-container">
                    <div class="timezone-btn" data-tz="朝">朝<br><small>5:00-11:00</small></div>
                    <div class="timezone-btn" data-tz="昼">昼<br><small>11:00-17:00</small></div>
                    <div class="timezone-btn" data-tz="夕方">夕方<br><small>17:00-19:00</small></div>
                    <div class="timezone-btn" data-tz="夜">夜<br><small>19:00-24:00</small></div>
                    <div class="timezone-btn" data-tz="深夜">深夜<br><small>0:00-5:00</small></div>
                </div>
            </div>

            <div class="form-group">
                <label>その時の気持ち（必須 / 1つ選択）</label>
                <div class="tag-grid" id="emotion-container">
                    <div class="tag-btn emotion-btn" data-emo="落ち着きたい">落ち着きたい</div>
                    <div class="tag-btn emotion-btn" data-emo="考え事をしたい">考え事をしたい</div>
                    <div class="tag-btn emotion-btn" data-emo="逃げたい">逃げたい</div>
                    <div class="tag-btn emotion-btn" data-emo="一人になりたい">一人になりたい</div>
                </div>
            </div>

            <div class="form-group">
                <label>言葉の堆積（任意）</label>
                <textarea id="comment" placeholder="この場所について一言" rows="3"></textarea>
            </div>

            <div class="btn-container">
                <button class="btn btn-secondary" onclick="changeStep(1)">戻る</button>
                <button class="btn btn-primary" id="to-step-3" disabled>確認へ</button>
            </div>
        </section>

        <!-- STEP 3: 確認 -->
        <section id="step-3" class="step">
            <header>
                <h1>採集の確認</h1>
                <p class="subtitle">以下の内容で都市の記憶を記録します</p>
            </header>

            <div class="confirm-item">
                <p class="confirm-label">地点</p>
                <p class="confirm-value" id="confirm-place">...</p>
            </div>

            <div class="confirm-item">
                <p class="confirm-label">時間</p>
                <p class="confirm-value" id="confirm-timezone">...</p>
            </div>

            <div class="confirm-item">
                <p class="confirm-label">気持ち</p>
                <p class="confirm-value" id="confirm-emotion">...</p>
            </div>

            <div class="confirm-item">
                <p class="confirm-label">気配</p>
                <div class="confirm-tags" id="confirm-tags"></div>
            </div>

            <div class="confirm-item">
                <p class="confirm-label">言葉</p>
                <p class="confirm-value" id="confirm-comment">...</p>
            </div>

            <div class="btn-container">
                <button class="btn btn-secondary" onclick="changeStep(2)">修正する</button>
                <button class="btn btn-primary" id="submit-final">記録する</button>
            </div>
        </section>

        <!-- STEP 4: 完了 -->
        <section id="step-4" class="step">
            <div class="success-screen">
                <p class="success-text">記録しました</p>
                <button class="btn-outline" onclick="location.reload()">続けて採集する</button>
            </div>
        </section>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // --- Firebase 設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyBXoQYrIC4dQLDCnE76je_CU32KqYAxuWw",
            authDomain: "city-log-6817f.firebaseapp.com",
            projectId: "city-log-6817f",
            storageBucket: "city-log-6817f.firebasestorage.app",
            messagingSenderId: "524271753384",
            appId: "1:524271753384:web:c3983c10b2331f6cf38a9d",
            measurementId: "G-ET61473CP1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const postsCol = collection(db, "posts");

        let selectedLatLng = null;
        let selectedPlaceName = "指定された地点";
        let selectedTimeZone = null;
        let selectedEmotion = null;
        const selectedTags = new Set();

        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([35.0116, 135.7681], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

        let currentMarker = null;

        map.on('click', (e) => {
            setMarker(e.latlng, "指定された地点");
        });

        function setMarker(latlng, name) {
            selectedLatLng = latlng;
            selectedPlaceName = name;
            if (currentMarker) {
                currentMarker.setLatLng(latlng);
            } else {
                currentMarker = L.marker(latlng, { draggable: true }).addTo(map);
                currentMarker.on('dragend', (ev) => {
                    selectedLatLng = ev.target.getLatLng();
                });
            }
            document.getElementById('to-step-2').disabled = false;
        }

        const searchInput = document.getElementById('place-search');
        const resultsBox = document.getElementById('search-results');
        let searchTimeout;

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            const query = searchInput.value;
            if (query.length < 2) { resultsBox.style.display = 'none'; return; }
            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&addressdetails=1`);
                    const data = await res.json();
                    resultsBox.innerHTML = '';
                    if (data.length > 0) {
                        resultsBox.style.display = 'block';
                        data.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'search-result-item';
                            div.innerText = item.display_name;
                            div.onclick = () => {
                                const latlng = L.latLng(item.lat, item.lon);
                                map.setView(latlng, 16);
                                setMarker(latlng, item.display_name);
                                resultsBox.style.display = 'none';
                                searchInput.value = item.display_name;
                            };
                            resultsBox.appendChild(div);
                        });
                    }
                } catch(e) {}
            }, 500);
        });

        document.querySelectorAll('.tag-btn').forEach(btn => {
            btn.onclick = () => {
                const tag = btn.dataset.tag;
                if (selectedTags.has(tag)) {
                    selectedTags.delete(tag);
                    btn.classList.remove('selected');
                } else {
                    selectedTags.add(tag);
                    btn.classList.add('selected');
                }
                updateValidation();
            };
        });

        document.querySelectorAll('.timezone-btn').forEach(btn => {
            btn.onclick = () => {
                const tz = btn.dataset.tz;
                document.querySelectorAll('.timezone-btn').forEach(b => b.classList.remove('selected'));
                if (selectedTimeZone === tz) {
                    selectedTimeZone = null;
                } else {
                    selectedTimeZone = tz;
                    btn.classList.add('selected');
                }
                updateValidation();
            };
        });

        // --- 感情選択 (単一選択) ---
        document.querySelectorAll('.emotion-btn').forEach(btn => {
            btn.onclick = () => {
                const emo = btn.dataset.emo;
                document.querySelectorAll('.emotion-btn').forEach(b => b.classList.remove('selected'));
                
                if (selectedEmotion === emo) {
                    selectedEmotion = null;
                } else {
                    selectedEmotion = emo;
                    btn.classList.add('selected');
                }
                updateValidation();
            };
        });

        function updateValidation() {
            document.getElementById('to-step-3').disabled = (selectedTags.size === 0 || !selectedTimeZone || !selectedEmotion);
        }

        window.changeStep = (num) => {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(`step-${num}`).classList.add('active');
            window.scrollTo(0, 0);
            if (num === 3) {
                document.getElementById('confirm-place').innerText = selectedPlaceName;
                document.getElementById('confirm-timezone').innerText = selectedTimeZone;
                document.getElementById('confirm-emotion').innerText = selectedEmotion || '(未選択)';
                
                const tagWrap = document.getElementById('confirm-tags');
                tagWrap.innerHTML = '';
                selectedTags.forEach(t => {
                    const span = document.createElement('span');
                    span.className = 'confirm-tag';
                    span.innerText = t;
                    tagWrap.appendChild(span);
                });
                document.getElementById('confirm-comment').innerText = document.getElementById('comment').value || '(未入力)';
            }
        };

        document.getElementById('to-step-2').onclick = () => changeStep(2);
        document.getElementById('to-step-3').onclick = () => changeStep(3);

        document.getElementById('submit-final').onclick = async () => {
            const btn = document.getElementById('submit-final');
            btn.disabled = true;
            btn.innerText = '記録中...';
            try {
                await addDoc(postsCol, {
                    lat: selectedLatLng.lat,
                    lng: selectedLatLng.lng,
                    placeName: selectedPlaceName,
                    tags: Array.from(selectedTags),
                    timeZone: selectedTimeZone,
                    emotion: selectedEmotion,
                    comment: document.getElementById('comment').value,
                    createdAt: serverTimestamp()
                });
                changeStep(4);
            } catch (err) {
                alert("保存に失敗しました。");
                btn.disabled = false;
                btn.innerText = '記録する';
            }
        };

        window.resetUI = () => {
            document.getElementById('success-message').style.display = 'none';
            document.getElementById('main-content').style.opacity = '1';
            
            // 状態のリセット
            selectedTags.clear();
            selectedTimeZone = null;
            selectedEmotion = null;
            selectedLatLng = null;
            
            // フォームのリセット
            document.getElementById('comment').value = '';
            document.getElementById('lat').value = '';
            document.getElementById('lng').value = '';
            
            // 視覚的状態のリセット
            document.querySelectorAll('.tag-btn, .timezone-btn, .emotion-btn').forEach(btn => btn.classList.remove('selected'));
            if (currentMarker) map.removeLayer(currentMarker);
            currentMarker = null;
            
            // ボタンのリセット
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('submit-btn').innerText = "記録を残す";
            
            changeStep(1);
        };
    </script>
</body>
</html>
